name: Build External EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Release x64
      run: msbuild external-base.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Upload Artifact (EXE)
      uses: actions/upload-artifact@v4
      with:
        name: external-base-exe
        path: x64\Release\*.exe
